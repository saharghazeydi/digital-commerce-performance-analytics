version: 2

models:
  - name: bi_executive_daily
    description: >
      BI-facing daily executive performance dataset sourced from
      executive_kpi_trends_daily. It consolidates governed headline KPIs,
      additive components, rolling seven-day metrics, and Week-over-Week
      comparisons without redefining upstream KPI logic. The model preserves
      distinct session-date, transaction-date, and session-cohort semantics.
    columns:
      - name: date_day
        description: Governed calendar date and unique grain of the model.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

      - name: session_count
        description: Governed session count using session-date semantics.
        data_tests:
          - not_null

      - name: purchasing_session_count
        description: Governed purchasing-session count using session-date semantics.
        data_tests:
          - not_null

      - name: conversion_rate
        description: >
          Governed daily conversion rate calculated from purchasing sessions
          and sessions using the same session-date population.

      - name: transaction_count
        description: Governed transaction count using transaction-date semantics.
        data_tests:
          - not_null

      - name: purchase_revenue
        description: Governed purchase revenue using transaction-date semantics.
        data_tests:
          - not_null

      - name: average_order_value
        description: >
          Governed daily Average Order Value using transaction-date purchase
          revenue and transaction count.

      - name: session_attributed_transaction_count
        description: >
          Governed transaction count attributed to sessions originating on
          date_day using session-cohort semantics.
        data_tests:
          - not_null

      - name: session_attributed_purchase_revenue
        description: >
          Governed purchase revenue attributed to sessions originating on
          date_day using session-cohort semantics.
        data_tests:
          - not_null

      - name: revenue_per_session
        description: >
          Governed Revenue per Session using session-attributed purchase
          revenue and sessions.

      - name: revenue_7d
        description: >
          Governed rolling purchase revenue for date_day and the previous
          six calendar dates using transaction-date semantics.
        data_tests:
          - not_null

      - name: sessions_7d
        description: >
          Governed rolling session count for date_day and the previous
          six calendar dates.
        data_tests:
          - not_null

      - name: purchasing_sessions_7d
        description: >
          Governed rolling purchasing-session count for date_day and the
          previous six calendar dates.
        data_tests:
          - not_null

      - name: conversion_rate_7d
        description: >
          Governed seven-day conversion rate calculated from compatible
          rolling purchasing-session and session counts, not from an average
          of daily conversion rates.
        data_tests:
          - not_null

      - name: revenue_previous_7d
        description: >
          Governed seven-day revenue for the comparison period ending seven
          calendar days before date_day. Null when prior history is unavailable.

      - name: conversion_rate_previous_7d
        description: >
          Governed seven-day conversion rate for the comparison period ending
          seven calendar days before date_day. Null when prior history is unavailable.

      - name: revenue_wow_absolute_change
        description: >
          Absolute change between current and prior governed seven-day revenue.

      - name: revenue_wow_pct_change
        description: >
          Relative change between current and prior governed seven-day revenue.
          Null when the prior denominator is zero or unavailable.

      - name: conversion_wow_absolute_change
        description: >
          Absolute change between current and prior governed seven-day
          conversion rates.

      - name: conversion_wow_pct_change
        description: >
          Relative change between current and prior governed seven-day
          conversion rates. Null when the prior denominator is zero or unavailable.


  - name: bi_channel_daily
    description: >
      BI-facing daily acquisition and channel-performance dataset sourced from
      executive_channel_drivers_daily. The model contains one row per governed
      session date and channel. Commercial measures are explicitly
      session-attributed and must not be interpreted as transaction-date measures.
    data_tests:
      - unique:
          arguments:
            column_name: "concat(cast(session_date as string), '||', cast(channel_key as string))"

    columns:
      - name: session_date
        description: Governed session date for channel analysis.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

      - name: channel_key
        description: Governed channel surrogate key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channel')
                field: channel_key

      - name: channel_group
        description: Governed business-facing channel grouping.
        data_tests:
          - not_null

      - name: channel_description
        description: Business description of the governed channel grouping.

      - name: sort_order
        description: Governed display order for channel reporting.
        data_tests:
          - not_null

      - name: session_count
        description: Governed session count for the session date and channel.
        data_tests:
          - not_null

      - name: purchasing_session_count
        description: >
          Governed purchasing-session count for the session date and channel.
        data_tests:
          - not_null

      - name: conversion_rate
        description: >
          Governed channel conversion rate calculated from compatible
          purchasing-session and session counts.

      - name: session_attributed_transaction_count
        description: >
          Governed transactions attributed to sessions originating on the
          session date for the channel.
        data_tests:
          - not_null

      - name: session_attributed_purchase_revenue
        description: >
          Governed purchase revenue attributed to sessions originating on the
          session date for the channel.
        data_tests:
          - not_null

      - name: session_contribution
        description: >
          Daily channel share of governed sessions. This is non-additive across
          dates and must be recalculated from compatible components for larger periods.
        data_tests:
          - not_null

      - name: purchasing_session_contribution
        description: >
          Daily channel share of governed purchasing sessions. Null when the
          compatible daily denominator is zero.

      - name: transaction_contribution
        description: >
          Daily channel share of session-attributed transactions. This measure
          is non-additive across dates.

      - name: revenue_contribution
        description: >
          Daily channel share of session-attributed purchase revenue. This
          measure is non-additive across dates.


  - name: bi_commerce_daily
    description: >
      BI-facing transaction-date commerce dataset sourced from
      mart_ecommerce_daily. The model provides detailed governed commercial
      measures without mixing session-date or session-cohort populations into
      the commerce interface.
    columns:
      - name: date_day
        description: Governed transaction date and unique grain of the model.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

      - name: transaction_count
        description: Governed transaction count using transaction-date semantics.
        data_tests:
          - not_null

      - name: purchase_revenue
        description: Governed purchase revenue using transaction-date semantics.
        data_tests:
          - not_null

      - name: refund_value
        description: >
          Governed refund value using transaction-date semantics. It remains
          separate from purchase revenue and does not define net revenue.
        data_tests:
          - not_null

      - name: shipping_value
        description: Governed shipping value using transaction-date semantics.
        data_tests:
          - not_null

      - name: tax_value
        description: Governed tax value using transaction-date semantics.
        data_tests:
          - not_null

      - name: total_item_quantity
        description: Governed total item quantity using transaction-date semantics.
        data_tests:
          - not_null

      - name: average_order_value
        description: >
          Governed daily Average Order Value. Larger-period AOV must be
          recalculated from purchase_revenue and transaction_count.

      - name: items_per_transaction
        description: >
          Governed daily items per transaction. Larger-period values must be
          recalculated from total_item_quantity and transaction_count.


  - name: bi_user_behavior
    description: >
      BI-facing observed pseudo-user behaviour dataset sourced from
      mart_user_behavior. The model contains one row per user_pseudo_id across
      the available observation window. user_pseudo_id is an analytical
      pseudo-user identifier and must not be interpreted as authenticated
      customer identity.
    columns:
      - name: user_pseudo_id
        description: >
          Analytical GA4 pseudo-user identifier and unique grain of the model.
          It is not an authenticated customer identifier.
        data_tests:
          - not_null
          - unique

      - name: session_count
        description: Number of governed sessions observed for the pseudo-user.
        data_tests:
          - not_null

      - name: active_date_count
        description: Number of distinct observed session dates for the pseudo-user.
        data_tests:
          - not_null

      - name: purchasing_session_count
        description: Number of governed purchasing sessions for the pseudo-user.
        data_tests:
          - not_null

      - name: purchasing_date_count
        description: Number of distinct observed purchasing dates for the pseudo-user.
        data_tests:
          - not_null

      - name: first_observed_session_date
        description: >
          First session date observed within the available dataset. It does not
          necessarily represent the user's true first-ever activity.

      - name: last_observed_session_date
        description: >
          Last session date observed within the available dataset. It does not
          necessarily represent the user's true final activity.

      - name: first_observed_purchase_date
        description: >
          First governed purchase date observed within the available dataset.
          Null for pseudo-users with no governed purchase.

      - name: last_observed_purchase_date
        description: >
          Last governed purchase date observed within the available dataset.
          Null for pseudo-users with no governed purchase.

      - name: observed_user_span_days
        description: >
          Observed span between first and last session activity within the
          available dataset. This is not true customer tenure.
        data_tests:
          - not_null

      - name: transaction_count
        description: Governed transactions observed for the pseudo-user.
        data_tests:
          - not_null

      - name: purchase_revenue
        description: Governed purchase revenue observed for the pseudo-user.
        data_tests:
          - not_null

      - name: refund_value
        description: Governed refund value observed for the pseudo-user.
        data_tests:
          - not_null

      - name: total_item_quantity
        description: Governed total item quantity observed for the pseudo-user.
        data_tests:
          - not_null

      - name: is_purchasing_user
        description: >
          Indicates whether the pseudo-user has at least one governed purchase.
        data_tests:
          - not_null

      - name: is_multi_session_user
        description: Indicates whether more than one governed session was observed.
        data_tests:
          - not_null

      - name: returned_on_later_date
        description: >
          Indicates observed activity on a later date within the available
          observation window. This is not a production-grade retention metric.
        data_tests:
          - not_null

      - name: is_repeat_purchasing_session_user
        description: >
          Indicates governed purchase activity across more than one purchasing session.
        data_tests:
          - not_null

      - name: is_repeat_purchasing_date_user
        description: >
          Indicates governed purchase activity across more than one purchasing date.
        data_tests:
          - not_null


  - name: bi_segment_daily
    description: >
      BI-facing device and geography performance dataset sourced from
      mart_segment_daily. The model contains one row per session date,
      device category, and country. Commercial measures are session-attributed
      and are explicitly renamed at the serving boundary to prevent confusion
      with transaction-date commerce measures.
    data_tests:
      - unique:
          arguments:
            column_name: "concat(cast(session_date as string), '||', device_category, '||', country)"

    columns:
      - name: session_date
        description: Governed session date for segment analysis.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

      - name: device_category
        description: Governed normalized device category.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - desktop
                  - mobile
                  - tablet
                  - Unknown

      - name: country
        description: Governed country associated with the session.
        data_tests:
          - not_null

      - name: session_count
        description: Governed session count for the segment.
        data_tests:
          - not_null

      - name: purchasing_session_count
        description: Governed purchasing-session count for the segment.
        data_tests:
          - not_null

      - name: conversion_rate
        description: >
          Governed segment conversion rate calculated from compatible
          purchasing-session and session counts.

      - name: session_attributed_transaction_count
        description: >
          Governed transaction count attributed to sessions in the segment.
          This is not a transaction-date measure.
        data_tests:
          - not_null

      - name: session_attributed_purchase_revenue
        description: >
          Governed purchase revenue attributed to sessions in the segment.
          This is not a transaction-date measure.
        data_tests:
          - not_null

      - name: revenue_per_session
        description: >
          Governed Revenue per Session calculated from compatible
          session-attributed revenue and session count.