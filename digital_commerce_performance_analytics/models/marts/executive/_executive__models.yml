version: 2

models:
  - name: executive_kpi_daily
    description: >
      Governed daily executive KPI base model for leadership-level digital
      commerce reporting. The model contains one row per governed calendar date
      and consumes mart_ecommerce_daily without reconstructing upstream session,
      transaction, or attribution logic. It preserves distinct session-date,
      transaction-date, and session-cohort metric semantics while exposing the
      additive components required for correct downstream reaggregation and
      trend calculations.

    columns:
      - name: date_day
        description: >
          Governed calendar date and unique grain of the executive KPI model.
          Metric interpretation depends on the documented semantic family.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

      - name: session_count
        description: >
          Number of governed sessions occurring on date_day using session-date
          semantics.
        data_tests:
          - not_null

      - name: purchasing_session_count
        description: >
          Number of governed sessions occurring on date_day that contain at
          least one governed purchase.
        data_tests:
          - not_null

      - name: transaction_count
        description: >
          Number of governed transactions occurring on date_day using
          transaction-date semantics.
        data_tests:
          - not_null

      - name: purchase_revenue
        description: >
          Governed purchase revenue occurring on date_day using
          transaction-date semantics.
        data_tests:
          - not_null

      - name: session_attributed_transaction_count
        description: >
          Number of governed transactions attributed to sessions originating
          on date_day using session-cohort semantics.
        data_tests:
          - not_null

      - name: session_attributed_purchase_revenue
        description: >
          Governed purchase revenue attributed to sessions originating on
          date_day using session-cohort semantics.
        data_tests:
          - not_null

      - name: conversion_rate
        description: >
          Governed session conversion rate calculated as purchasing_session_count
          divided by session_count using the same session-date population.

      - name: average_order_value
        description: >
          Governed average order value calculated as transaction-date
          purchase_revenue divided by transaction_count.

      - name: revenue_per_session
        description: >
          Governed revenue per session calculated as session-attributed
          purchase revenue divided by session_count using session-cohort
          semantics.

  - name: executive_kpi_trends_daily
    description: >
      Governed daily executive KPI trend model for leadership-level digital
      commerce performance monitoring. The model preserves the base executive
      KPI values from executive_kpi_daily and adds rolling seven-day metrics
      and Week-over-Week comparisons. Revenue trend measures retain
      transaction-date semantics, while conversion trend measures retain
      session-date semantics.

    columns:
      - name: date_day
        description: >
          Governed calendar date and unique grain of the executive trend model.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

      - name: session_count
        description: >
          Governed daily session count inherited from executive_kpi_daily.
        data_tests:
          - not_null

      - name: purchasing_session_count
        description: >
          Governed daily purchasing-session count inherited from
          executive_kpi_daily.
        data_tests:
          - not_null

      - name: transaction_count
        description: >
          Governed daily transaction count using transaction-date semantics.
        data_tests:
          - not_null

      - name: purchase_revenue
        description: >
          Governed daily purchase revenue using transaction-date semantics.
        data_tests:
          - not_null

      - name: conversion_rate
        description: >
          Governed daily session conversion rate inherited from the executive
          KPI base layer.

      - name: average_order_value
        description: >
          Governed daily average order value using transaction-date semantics.

      - name: revenue_per_session
        description: >
          Governed daily revenue per session using session-cohort semantics.

      - name: session_attributed_transaction_count
        description: >
          Governed transaction count attributed to sessions originating on
          date_day.
        data_tests:
          - not_null

      - name: session_attributed_purchase_revenue
        description: >
          Governed purchase revenue attributed to sessions originating on
          date_day.
        data_tests:
          - not_null

      - name: revenue_7d
        description: >
          Rolling purchase revenue for the current date and previous six
          calendar dates using transaction-date semantics.
        data_tests:
          - not_null

      - name: sessions_7d
        description: >
          Rolling session count for the current date and previous six calendar
          dates.
        data_tests:
          - not_null

      - name: purchasing_sessions_7d
        description: >
          Rolling purchasing-session count for the current date and previous
          six calendar dates.
        data_tests:
          - not_null

      - name: conversion_rate_7d
        description: >
          Rolling seven-day conversion rate calculated from rolling purchasing
          sessions divided by rolling sessions. This metric is not an average
          of daily conversion rates.
        data_tests:
          - not_null

      - name: revenue_previous_7d
        description: >
          Rolling seven-day revenue associated with the period ending seven
          calendar days before date_day. Null when prior history is unavailable.

      - name: conversion_rate_previous_7d
        description: >
          Rolling seven-day conversion rate associated with the period ending
          seven calendar days before date_day. Null when prior history is
          unavailable.

      - name: revenue_wow_absolute_change
        description: >
          Absolute difference between current rolling seven-day revenue and
          the equivalent rolling seven-day revenue ending seven days earlier.

      - name: revenue_wow_pct_change
        description: >
          Relative change between current and prior rolling seven-day revenue.
          Null when the prior-period revenue is zero or unavailable.

      - name: conversion_wow_absolute_change
        description: >
          Absolute difference between current and prior rolling seven-day
          conversion rates. Downstream BI may format this difference as
          percentage points.

      - name: conversion_wow_pct_change
        description: >
          Relative change between current and prior rolling seven-day
          conversion rates. Null when the prior-period conversion rate is zero
          or unavailable.

  - name: executive_channel_drivers_daily
    description: >
      Governed daily executive channel-driver model for leadership-level
      performance analysis. The model contains one row per session_date and
      governed channel and consumes mart_channel_daily without reconstructing
      upstream attribution logic. Session and conversion metrics use
      session-date semantics, while transaction and revenue measures are
      explicitly session-attributed. Contribution metrics compare each channel
      with the corresponding daily total using the same semantic population.

    columns:
      - name: session_date
        description: >
          Governed session date used for daily channel performance and
          contribution analysis.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

      - name: channel_key
        description: >
          Governed channel surrogate key inherited from mart_channel_daily.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channel')
                field: channel_key

      - name: channel_group
        description: >
          Governed business-facing channel grouping inherited from dim_channel.
        data_tests:
          - not_null

      - name: channel_description
        description: >
          Business description of the governed channel grouping.

      - name: sort_order
        description: >
          Governed display order for channel reporting.
        data_tests:
          - not_null

      - name: session_count
        description: >
          Number of governed sessions originating on session_date for the
          channel.
        data_tests:
          - not_null

      - name: purchasing_session_count
        description: >
          Number of governed sessions originating on session_date for the
          channel that contain at least one governed purchase.
        data_tests:
          - not_null

      - name: session_attributed_transaction_count
        description: >
          Number of governed transactions attributed to sessions originating
          on session_date for the channel. This is a session-attributed measure,
          not a transaction-date measure.
        data_tests:
          - not_null

      - name: session_attributed_purchase_revenue
        description: >
          Governed purchase revenue attributed to sessions originating on
          session_date for the channel. This is a session-attributed measure,
          not a transaction-date measure.
        data_tests:
          - not_null

      - name: conversion_rate
        description: >
          Channel conversion rate calculated as purchasing_session_count
          divided by session_count using the same session-date population.

      - name: session_contribution
        description: >
          Share of all governed sessions on session_date attributable to the
          channel, calculated as channel session_count divided by the daily
          session total.
        data_tests:
          - not_null

      - name: purchasing_session_contribution
        description: >
          Share of governed purchasing sessions on session_date attributable
          to the channel. Null when the daily purchasing-session denominator
          is zero.

      - name: transaction_contribution
        description: >
          Share of session-attributed governed transactions on session_date
          attributable to the channel. Null when the corresponding daily
          transaction denominator is zero.

      - name: revenue_contribution
        description: >
          Share of session-attributed governed purchase revenue on session_date
          attributable to the channel. Null when the corresponding daily
          revenue denominator is zero.