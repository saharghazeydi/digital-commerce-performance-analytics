version: 2

models:
  - name: stg_ga4__events
    description: >
      Event-grain staging model built directly from the GA4 export.
      The model performs bounded extraction, typed scalar field extraction,
      and preserves one row per raw GA4 event without applying business logic.

    columns:
      - name: event_date
        description: Event date parsed from the raw GA4 export date string.
        data_tests:
          - not_null

      - name: event_timestamp
        description: Timestamp at which the GA4 event was recorded.
        data_tests:
          - not_null

      - name: event_name
        description: Name of the GA4 event, such as page_view, add_to_cart, or purchase.
        data_tests:
          - not_null

      - name: user_pseudo_id
        description: GA4 anonymous user identifier associated with the event.
        data_tests:
          - not_null

      - name: platform
        description: Platform from which the event was generated, such as WEB.

      - name: device_category
        description: Device category associated with the event, sourced from the GA4 device record.

      - name: country
        description: Country associated with the event, sourced from the GA4 geographic record.

      - name: ga_session_id
        description: GA4 session identifier extracted from event_params.
        data_tests:
          - not_null

      - name: ga_session_number
        description: Sequential GA4 session number for the user, extracted from event_params.
        data_tests:
          - not_null

      - name: page_location
        description: Full page URL associated with the event, extracted from event_params.
        data_tests:
          - not_null

      - name: page_title
        description: Page title associated with the event when supplied by GA4.

      - name: page_referrer
        description: Referring page URL associated with the event when supplied by GA4.

      - name: source
        description: Traffic source value extracted from event_params when available.

      - name: medium
        description: Traffic medium value extracted from event_params when available.

      - name: campaign
        description: Campaign value extracted from event_params when available.

      - name: transaction_id
        description: >
          Source-provided ecommerce transaction identifier. The raw GA4 export
          may use the literal placeholder '(not set)' on non-purchase events,
          so a populated value does not by itself represent a valid transaction.

      - name: purchase_revenue
        description: Purchase revenue recorded by GA4 for applicable ecommerce events.

      - name: refund_value
        description: Refund value recorded by GA4 for applicable ecommerce events.

      - name: shipping_value
        description: Shipping value recorded by GA4 for applicable ecommerce events.

      - name: tax_value
        description: Tax value recorded by GA4 for applicable ecommerce events.

      - name: total_item_quantity
        description: Total item quantity associated with the event when populated by GA4.

      - name: unique_items
        description: Number of unique items associated with the event when populated by GA4.

  - name: stg_ga4__items
    description: >
      Item-grain staging model built from the repeated GA4 items array.
      The model preserves one row per item occurrence within a raw GA4 event
      and retains the item position through item_offset.

    columns:
      - name: event_date
        description: Event date parsed from the raw GA4 export date string.
        data_tests:
          - not_null

      - name: event_timestamp
        description: Timestamp at which the parent GA4 event was recorded.
        data_tests:
          - not_null

      - name: event_name
        description: Name of the parent GA4 event associated with the item.
        data_tests:
          - not_null

      - name: user_pseudo_id
        description: GA4 anonymous user identifier associated with the parent event.
        data_tests:
          - not_null

      - name: platform
        description: Platform from which the parent event was generated.

      - name: ga_session_id
        description: GA4 session identifier extracted from the parent event parameters.
        data_tests:
          - not_null

      - name: transaction_id
        description: >
          Source-provided ecommerce transaction identifier from the parent event.
          The raw GA4 export may use the literal placeholder '(not set)', so a
          populated value does not by itself represent a valid transaction.

      - name: item_offset
        description: Zero-based position of the item within the parent event items array.
        data_tests:
          - not_null

      - name: item_id
        description: Source-provided identifier of the item.
        data_tests:
          - not_null

      - name: item_name
        description: Source-provided name of the item.
        data_tests:
          - not_null

      - name: item_brand
        description: Source-provided brand of the item.
        data_tests:
          - not_null

      - name: item_variant
        description: Source-provided item variant.
        data_tests:
          - not_null

      - name: item_category
        description: Source-provided primary item category.
        data_tests:
          - not_null

      - name: price
        description: Source-provided item price when populated by GA4.

      - name: quantity
        description: Source-provided item quantity when populated by GA4.

      - name: item_revenue
        description: Source-provided item-level revenue when populated by GA4.

      - name: coupon
        description: Source-provided coupon value associated with the item.
        data_tests:
          - not_null

      - name: affiliation
        description: Source-provided affiliation value associated with the item.
        data_tests:
          - not_null